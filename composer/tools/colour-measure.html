<!doctype html>
<meta charset="utf-8">
<title>Colour measure</title>
<!-- Loaded by tools/measure-colours.mjs in headless Chrome. Draws each
     pattern through the real Renderer with the simulated audio and counts
     the colours in the frames it would send. Options come in the query
     string; results go in the <pre> as tab-separated rows. -->
<canvas id="canvas"></canvas>
<pre id="out">running</pre>
<script type="module">
const out = document.getElementById('out');
try {
  const options = new URLSearchParams(location.search);
  const W = Number(options.get('width') || 256), H = Number(options.get('height') || 192);
  const FPS = 30, FRAMES = Math.round(Number(options.get('seconds') || 3) * FPS), EVERY = 6, DT = 1 / FPS;
  const only = options.get('patterns') ? options.get('patterns').split(',') : null;
  // Patterns draw with Math.random; a seeded one makes a run repeatable.
  let seed = Number(options.get('seed') || 1) >>> 0;
  Math.random = () => {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const look = {
    paletteId: options.get('palette') || 'original', hue: Number(options.get('hue') || 0),
    brightness: Number(options.get('brightness') || 1), gamma: Number(options.get('gamma') || 1),
  };
  const { PATTERNS } = await import('./patterns.js');
  const { Renderer } = await import('./renderer.js');
  const { AudioAnalyzer } = await import('./audio.js');
  const { SHAPE_DEFAULTS } = await import('./shape.js');
  const { SPECTRUM_DEFAULTS } = await import('./spectrum-plot.js');
  const renderer = new Renderer(document.getElementById('canvas'));
  renderer.setSize(W, H);
  const rows = [];
  for (const pattern of PATTERNS) {
    // The Media Player has nothing to show without a file.
    if (pattern.isReady || (only && !only.includes(pattern.id)))
      continue;
    const family = pattern.group || (pattern.glsl ? 'Shader' : 'Aurora, Fibonacci, Spectrum Lab');
    const audio = new AudioAnalyzer();
    audio.startSimulated();
    let time = 0, auroraTime = 0, lit = 0, samples = 0, peak = 0;
    const union = new Set(), hueBands = new Set(), perFrame = [], levels = new Set();
    try {
      for (let frame = 0; frame < FRAMES; ++frame) {
        const features = audio.update(DT, 1);
        time += DT * (1 + features.level * 0.8);
        auroraTime += DT;
        const rgb = renderer.render({
          pattern, previousPattern: null, mix: 1, layer: null, shape: SHAPE_DEFAULTS,
          beatPosition: frame * DT * 2, changeClock: frame * DT * 2, time, auroraTime, previousTime: time,
          audio: features, audioTime: frame * DT, spectrum: audio.spectrum, spectrumLeft: audio.spectrumLeft,
          spectrumRight: audio.spectrumRight, wave: audio.wave, hue: look.hue, manualHue: look.hue,
          musicalKey: null, brightness: look.brightness, gamma: look.gamma, flock: { count: null },
          auroraDotSize: null, mediaFit: 'cover', silenceMode: 'quiet', paletteId: look.paletteId,
          spectrumOptions: SPECTRUM_DEFAULTS, rawSpectrum: audio.plotInput,
          overlays: { enabled: false, elements: [] }, wallTime: Date.now(),
        });
        // A frame in every six, so that each sample has moved on.
        if (frame % EVERY !== EVERY - 1)
          continue;
        const colours = new Set(), hues = new Map();
        let litHere = 0, saturated = 0;
        for (let i = 0; i < rgb.length; i += 3) {
          const r = rgb[i], g = rgb[i + 1], b = rgb[i + 2];
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          colours.add((r << 16) | (g << 8) | b);
          levels.add(max);
          peak = Math.max(peak, max);
          if (max >= 16)
            litHere++;
          // Hue counts only where there is colour to see: not dark, not grey.
          if (max >= 32 && (max - min) / max >= 0.25) {
            const d = max - min;
            const h = max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
            const band = Math.floor(h * 4) % 24;
            hues.set(band, (hues.get(band) || 0) + 1);
            saturated++;
          }
        }
        colours.forEach((colour) => union.add(colour));
        // A band counts when it holds at least 0.5% of the coloured pixels.
        hues.forEach((count, band) => { if (count >= saturated * 0.005) hueBands.add(band); });
        perFrame.push(colours.size);
        lit += litHere / (W * H);
        samples++;
      }
      perFrame.sort((a, b) => a - b);
      rows.push([pattern.id, pattern.name, family, perFrame[Math.floor(perFrame.length / 2)], perFrame.at(-1),
        union.size, hueBands.size, levels.size, peak, Math.round(lit / samples * 100)].join('\t'));
    } catch (error) {
      rows.push([pattern.id, pattern.name, family, 'ERROR', error.message].join('\t'));
    }
  }
  out.textContent = rows.join('\n');
} catch (error) {
  out.textContent = `FAIL ${error.message}`;
}
</script>
