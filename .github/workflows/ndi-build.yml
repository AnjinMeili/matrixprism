# Builds the NDI test package of the desktop app (#62) for Windows x64: never
# a release. It runs only in the private development repository, started by
# hand (once this file is on main) or by a push to the ndi-output branch, and
# gates nothing. It builds the NDI variant (`npm --prefix app/ndi ci`,
# `npm run dist:win:ndi`), checks the packaged app on the runner against a
# stand-in NDI runtime compiled from NDI's MIT headers and with none, and
# keeps the installer as a workflow artifact for seven days. The runner has
# no NDI runtime and no NDI receiver. Actions are pinned as in release.yml.
name: NDI test build

on:
  workflow_dispatch:
  push:
    branches: [ndi-output]

permissions:
  contents: read

concurrency:
  group: ndi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: NDI build (windows-x64)
    if: github.repository == 'AnjinMeili/matrixprism-dev'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # NDI's headers (MIT), for the stand-in runtime only: DistroAV's copy at a fixed commit.
      NDI_HEADERS_REF: 04be005a085f4f6307f2a63ba612d0ad35b3aa9f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.1"

      # The recording tests need it, as in release.yml.
      - name: FFmpeg for the recording tests
        run: choco install ffmpeg -y --no-progress

      - name: Composer tests
        working-directory: composer
        run: npm test

      - name: App tests
        working-directory: app
        run: |
          npm ci
          npm test

      - name: koffi, the NDI build's option
        working-directory: app
        run: npm --prefix ndi ci

      - name: Build
        working-directory: app
        run: npm run dist:win:ndi

      - name: NDI's headers, for the stand-in runtime
        run: |
          mkdir -p "$RUNNER_TEMP/ndi-headers"
          for name in compat deprecated DynamicLoad Find FrameSync Lib.cplusplus Lib Recv.ex Recv \
              RecvAdvertiser RecvListener Routing Send SendAdvertiser SendListener structs utilities; do
            curl -fsSL -o "$RUNNER_TEMP/ndi-headers/Processing.NDI.$name.h" \
              "https://raw.githubusercontent.com/DistroAV/DistroAV/$NDI_HEADERS_REF/lib/ndi/Processing.NDI.$name.h"
          done

      - name: Check the packaged app
        working-directory: app
        env:
          MATRIXPRISM_ELECTRON: ${{ github.workspace }}/app/dist-ndi/win-unpacked/MatrixPrism.exe
          MATRIXPRISM_PACKAGED: "1"
          # A runner renders in software: the checks judge behaviour, not speed.
          MATRIXPRISM_CI: "1"
        run: |
          headers="$RUNNER_TEMP/ndi-headers"
          failed=""
          check() { if node "$@"; then echo "PASS $1 $3"; else echo "FAIL $1 $3"; failed="$failed $1"; fi; }
          check check-ndi-binding.mjs --headers "$headers"
          check check-app-ndi.mjs --expect stub --headers "$headers"
          check check-app-ndi.mjs --expect missing
          check check-app.mjs
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MatrixPrism-ndi-windows-x64
          path: app/dist-ndi/*-ndi-setup-*.exe
          if-no-files-found: error
          retention-days: 7
