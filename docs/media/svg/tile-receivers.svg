  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-leds)" opacity="0.75"/>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-halo)"/>
  <g filter="url(#t-glow)"><g transform="translate(73 40) scale(1.1)"><path d="M38.8 21.6 A14 14 0 0 0 61.2 21.6" transform="rotate(180 50 21.8)" fill="none" stroke="#2ee6ff" stroke-width="4" stroke-linecap="round"/><path d="M29.2 14.4 A26 26 0 0 0 70.8 14.4" transform="rotate(180 50 18.2)" fill="none" stroke="#2ee6ff" stroke-width="4" stroke-linecap="round"/><path d="M50 30 V44" stroke="#2ee6ff" stroke-width="4" stroke-linecap="round"/><rect x="10" y="46" width="80" height="46" rx="7" fill="none" stroke="#2ee6ff" stroke-width="4"/><rect x="20" y="54" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="1"/><rect x="31.5" y="54" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="43" y="54" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="54.5" y="54" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="1"/><rect x="66" y="54" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="77.5" y="54" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="20" y="65" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="31.5" y="65" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="43" y="65" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="1"/><rect x="54.5" y="65" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="66" y="65" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="77.5" y="65" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="1"/><rect x="20" y="76" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="31.5" y="76" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="1"/><rect x="43" y="76" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="54.5" y="76" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/><rect x="66" y="76" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="1"/><rect x="77.5" y="76" width="7" height="7" rx="1.5" fill="#2ee6ff" opacity="0.4"/></g></g>
  <text x="128" y="190" font-size="21" font-weight="600" fill="#eef4ff" text-anchor="middle" letter-spacing="2">RECEIVERS · DDP</text>
  <text x="128" y="214" font-size="14.5" font-weight="400" fill="#b9c6e8" text-anchor="middle" letter-spacing="0.3">WLED or matrix-dmx</text>
  
