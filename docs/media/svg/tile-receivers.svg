<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Receivers · DDP: WLED or matrix-dmx</title>
  <style>@font-face{font-family:'Exo 2';src:url('../src/fonts/Exo2-latin.woff2') format('woff2');font-weight:300 800}text{font-family:'Exo 2','Avenir Next','Segoe UI',sans-serif}</style>
  <defs>
  <filter id="t-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <pattern id="t-leds" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect x="1.5" y="1.5" width="5" height="5" rx="1.4" fill="#1a1f47"/>
  </pattern>
  <linearGradient id="t-ground" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06071a"/><stop offset="1" stop-color="#120a2e"/>
  </linearGradient>
    <radialGradient id="t-halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2ee6ff" stop-opacity="0.22"/><stop offset="1" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <linearGradient id="t-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2ee6ff"/><stop offset="1" stop-color="#2ee6ff"/>
