<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Spectrum: Stereo spectra and bands</title>
  <style>@font-face{font-family:'Exo 2';src:url('../src/fonts/Exo2-latin.woff2') format('woff2');font-weight:300 800}text{font-family:'Exo 2','Avenir Next','Segoe UI',sans-serif}</style>
  <defs>
  <filter id="t-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <pattern id="t-leds" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect x="1.5" y="1.5" width="5" height="5" rx="1.4" fill="#1a1f47"/>
  </pattern>
  <linearGradient id="t-ground" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06071a"/><stop offset="1" stop-color="#120a2e"/>
  </linearGradient>
    <radialGradient id="t-halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#4dff9e" stop-opacity="0.22"/><stop offset="1" stop-color="#4dff9e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <linearGradient id="t-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4dff9e"/><stop offset="1" stop-color="#4dff9e"/>
  </linearGradient>
  <clipPath id="t-clip"><rect x="12" y="12" width="232" height="232" rx="34"/></clipPath>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-ground)"/>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-leds)" opacity="0.75"/>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-halo)"/>
  <g filter="url(#t-glow)"><g transform="translate(73 40) scale(1.1)"><rect x="9" y="32" width="7" height="58" rx="2" fill="#4dff9e" opacity="1"/><rect x="9" y="23" width="7" height="3" rx="1.5" fill="#4dff9e"/><rect x="20" y="18" width="7" height="72" rx="2" fill="#4dff9e" opacity="0.9437500000000001"/><rect x="20" y="9" width="7" height="3" rx="1.5" fill="#4dff9e"/><rect x="31" y="40" width="7" height="50" rx="2" fill="#4dff9e" opacity="0.8875000000000001"/><rect x="31" y="31" width="7" height="3" rx="1.5" fill="#4dff9e"/><rect x="42" y="26" width="7" height="64" rx="2" fill="#4dff9e" opacity="0.83125"/><rect x="42" y="17" width="7" height="3" rx="1.5" fill="#4dff9e"/><rect x="53" y="50" width="7" height="40" rx="2" fill="#4dff9e" opacity="0.775"/><rect x="53" y="41" width="7" height="3" rx="1.5" fill="#4dff9e"/><rect x="64" y="60" width="7" height="30" rx="2" fill="#4dff9e" opacity="0.71875"/><rect x="64" y="51" width="7" height="3" rx="1.5" fill="#4dff9e"/><rect x="75" y="46" width="7" height="44" rx="2" fill="#4dff9e" opacity="0.6625000000000001"/><rect x="75" y="37" width="7" height="3" rx="1.5" fill="#4dff9e"/><rect x="86" y="68" width="7" height="22" rx="2" fill="#4dff9e" opacity="0.6062500000000001"/><rect x="86" y="59" width="7" height="3" rx="1.5" fill="#4dff9e"/><path d="M4 94 H96" stroke="#4dff9e" stroke-width="3" stroke-linecap="round"/></g></g>
  <text x="128" y="190" font-size="21" font-weight="600" fill="#eef4ff" text-anchor="middle" letter-spacing="2">SPECTRUM</text>
  <text x="128" y="214" font-size="14.5" font-weight="400" fill="#b9c6e8" text-anchor="middle" letter-spacing="0.3">Stereo spectra and bands</text>
  
  <rect x="12" y="12" width="232" height="232" rx="34" fill="none" stroke="url(#t-edge)" stroke-width="6" opacity="0.35" filter="url(#t-soft)"/>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="none" stroke="url(#t-edge)" stroke-width="3"/>
</svg>
