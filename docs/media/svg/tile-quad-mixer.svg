<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Quad mixer: A B → Left, C D → Right</title>
  <style>@font-face{font-family:'Exo 2';src:url('../src/fonts/Exo2-latin.woff2') format('woff2');font-weight:300 800}text{font-family:'Exo 2','Avenir Next','Segoe UI',sans-serif}</style>
  <defs>
  <filter id="t-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <pattern id="t-leds" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect x="1.5" y="1.5" width="5" height="5" rx="1.4" fill="#1a1f47"/>
  </pattern>
  <linearGradient id="t-ground" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06071a"/><stop offset="1" stop-color="#120a2e"/>
  </linearGradient>
    <radialGradient id="t-halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2ee6ff" stop-opacity="0.22"/><stop offset="1" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <linearGradient id="t-edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2ee6ff"/><stop offset="1" stop-color="#2ee6ff"/>
  </linearGradient>
  <clipPath id="t-clip"><rect x="12" y="12" width="232" height="232" rx="34"/></clipPath>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-ground)"/>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-leds)" opacity="0.75"/>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="url(#t-halo)"/>
  <g filter="url(#t-glow)"><g transform="translate(73 40) scale(1.1)"><path d="M14 21 C14 36 28 34 28 44" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/><path d="M38 21 C38 36 28 34 28 44" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/><path d="M62 21 C62 36 72 34 72 44" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/><path d="M86 21 C86 36 72 34 72 44" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/><path d="M28 64 C28 76 50 72 50 80" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/><path d="M72 64 C72 76 50 72 50 80" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/><rect x="5" y="3" width="18" height="18" rx="4" fill="none" stroke="#2ee6ff" stroke-width="3.5"/><text x="14" y="16.5" font-size="12.5" font-weight="700" fill="#2ee6ff" text-anchor="middle">A</text><rect x="29" y="3" width="18" height="18" rx="4" fill="none" stroke="#2ee6ff" stroke-width="3.5"/><text x="38" y="16.5" font-size="12.5" font-weight="700" fill="#2ee6ff" text-anchor="middle">B</text><rect x="53" y="3" width="18" height="18" rx="4" fill="none" stroke="#2ee6ff" stroke-width="3.5"/><text x="62" y="16.5" font-size="12.5" font-weight="700" fill="#2ee6ff" text-anchor="middle">C</text><rect x="77" y="3" width="18" height="18" rx="4" fill="none" stroke="#2ee6ff" stroke-width="3.5"/><text x="86" y="16.5" font-size="12.5" font-weight="700" fill="#2ee6ff" text-anchor="middle">D</text><circle cx="28" cy="54" r="10" fill="none" stroke="#2ee6ff" stroke-width="3.5"/><text x="28" y="58.5" font-size="12" font-weight="700" fill="#2ee6ff" text-anchor="middle">L</text><circle cx="72" cy="54" r="10" fill="none" stroke="#2ee6ff" stroke-width="3.5"/><text x="72" y="58.5" font-size="12" font-weight="700" fill="#2ee6ff" text-anchor="middle">R</text><circle cx="50" cy="88" r="9" fill="#2ee6ff"/></g></g>
  <text x="128" y="190" font-size="21" font-weight="600" fill="#eef4ff" text-anchor="middle" letter-spacing="2">QUAD MIXER</text>
  <text x="128" y="214" font-size="14.5" font-weight="400" fill="#b9c6e8" text-anchor="middle" letter-spacing="0.3">A B → Left, C D → Right</text>
  
  <rect x="12" y="12" width="232" height="232" rx="34" fill="none" stroke="url(#t-edge)" stroke-width="6" opacity="0.35" filter="url(#t-soft)"/>
  <rect x="12" y="12" width="232" height="232" rx="34" fill="none" stroke="url(#t-edge)" stroke-width="3"/>
</svg>
